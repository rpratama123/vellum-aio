name: Verify Vellum AIO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-pexpect
      - run: scripts/static-checks.sh
      - run: scripts/build-local.sh vellum-aio:verify
      - name: Test the Responses provider
        run: >-
          docker run --rm --network none --workdir /opt/vellum/assistant
          --env HOME=/tmp --entrypoint bun vellum-aio:verify
          test src/__tests__/openai-responses-provider.test.ts
      - run: tests/lifecycle.sh vellum-aio:verify
      - name: Record image and packages
        run: scripts/image-evidence.sh vellum-aio:verify .build/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-manifest
          path: .build/evidence/
          include-hidden-files: true
